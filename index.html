<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak PDF Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
        }
        p {
            color: #666;
        }
        .tool-box {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #007bff;
            border-radius: 8px;
            background: #fafafa;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pak PDF Studio</h1>
        <p>Convert your files easily, securely, and completely free online.</p>

        <!-- Tool 1: Image to PDF -->
        <div class="tool-box">
            <h3>Image to PDF Converter</h3>
            <p>Select multiple images and convert them into a single PDF file.</p>
            <input type="file" id="imageInput" accept="image/*" multiple>
            <br><br>
            <button class="btn" onclick="alert('Image to PDF tool is ready!')">Convert to PDF</button>
        </div>

        <!-- Tool 2: Text to PDF -->
        <div class="tool-box">
            <h3>Text / Content to PDF</h3>
            <p>Convert your text notes or documents directly into a PDF format.</p>
            <textarea id="textContent" rows="4" style="width: 100%; padding: 8px;" placeholder="Type or paste your text here..."></textarea>
            <br><br>
            <button class="btn" onclick="alert('Text to PDF tool is ready!')">Generate PDF</button>
        </div>
    </div>

</body>
</html>
